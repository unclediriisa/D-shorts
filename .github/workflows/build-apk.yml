name: build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          if [ -d "D-shorts" ]; then cd D-shorts; fi
          npm install --legacy-peer-deps

      - name: Prebuild Android
        run: |
          if [ -d "D-shorts" ]; then cd D-shorts; fi
          rm -rf android
          npx expo prebuild --platform android --clean

      - name: Fix Gradle 8.6 (fixes Expo bug)
        run: |
          if [ -d "D-shorts/android" ]; then cd D-shorts/android; else cd android; fi
          sed -i 's/gradle-.*-all.zip/gradle-8.6-all.zip/' gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        run: |
          if [ -d "D-shorts/android" ]; then cd D-shorts/android; else cd android; fi
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: D-shorts-APK-unclediriisa
          path: |
            D-shorts/android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/*.apk
